<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle cx="950" cy="120" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow-purple)">
    <animate attributeName="r" values="120;150;120" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.10;0.18;0.10" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="280" r="110" fill="#06b6d4" opacity="0.12" filter="url(#glow-cyan)">
    <animate attributeName="r" values="100;130;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.10;0.16;0.10" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="340" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow-purple)">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Dynamic Background Stream Lines & Pulses (Behind Foreground Text) -->
  <g opacity="0.75">
    <!-- Stream Line 1 -->
    <path d="M 760 140 C 860 140, 890 200, 970 200 C 1050 200, 1070 150, 1150 150" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="5 5"/>
    <path d="M 760 270 C 840 270, 880 200, 970 200 C 1040 200, 1080 260, 1150 260" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="5 5"/>
    <path d="M 970 200 L 1150 200" fill="none" stroke="#334155" stroke-width="2.5"/>

    <!-- Animated Pulse Packets along pathways -->
    <circle r="5" fill="#38bdf8" filter="url(#glow-cyan)">
      <animateMotion path="M 760 140 C 860 140, 890 200, 970 200 C 1050 200, 1070 150, 1150 150" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#a855f7" filter="url(#glow-purple)">
      <animateMotion path="M 760 270 C 840 270, 880 200, 970 200 C 1040 200, 1080 260, 1150 260" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#34d399" filter="url(#glow-cyan)">
      <animateMotion path="M 970 200 L 1150 200" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Visual Architecture Nodes (Event Routing Illustration) -->
    <!-- Producer Node -->
    <g transform="translate(710, 115)">
      <rect width="90" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="45" y="28" text-anchor="middle" class="node-text">PRODUCER</text>
    </g>

    <!-- Inbound Gateway Node -->
    <g transform="translate(710, 245)">
      <rect width="90" height="48" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text x="45" y="28" text-anchor="middle" class="node-text">INBOUND</text>
    </g>

    <!-- Webhook Gateway Hub Node -->
    <g transform="translate(920, 172)">
      <rect width="105" height="56" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="2" filter="url(#glow-cyan)"/>
      <text x="52" y="27" text-anchor="middle" class="node-text" fill="#38bdf8">WEBHOOK</text>
      <text x="52" y="42" text-anchor="middle" font-size="10" font-family="-apple-system, sans-serif" font-weight="600" fill="#94a3b8">GATEWAY</text>
    </g>

    <!-- Destination Nodes -->
    <g transform="translate(1105, 126)">
      <rect width="75" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="37" y="25" text-anchor="middle" font-size="10" font-family="-apple-system, sans-serif" font-weight="700" fill="#cbd5e1">API / APP</text>
    </g>

    <g transform="translate(1105, 179)">
      <rect width="75" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
      <text x="37" y="25" text-anchor="middle" font-size="10" font-family="-apple-system, sans-serif" font-weight="700" fill="#cbd5e1">QUEUES</text>
    </g>

    <g transform="translate(1105, 239)">
      <rect width="75" height="42" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
      <text x="37" y="25" text-anchor="middle" font-size="10" font-family="-apple-system, sans-serif" font-weight="700" fill="#cbd5e1">NOTIFS</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT SECTION (Protected, High Contrast, Crystal Clear) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 72)">
      <rect width="250" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
      <circle cx="16" cy="14" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18.5" class="tagline">CURATED ECOSYSTEM GUIDE</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="0" y="152" class="title">
      Awesome Event Notification &amp;
    </text>
    <text x="0" y="206" class="title" fill="url(#accent-cyan)">
      Webhook Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="248" class="subtitle">
      Reliable outbound fan-out, inbound proxies, event gateways &amp; multi-channel alerts
    </text>

    <!-- Feature Badges / Pills -->
    <g transform="translate(0, 285)">
      <!-- Pill 1: Webhook Delivery -->
      <g transform="translate(0, 0)">
        <rect width="168" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="4" fill="#38bdf8"/>
        <text x="32" y="22.5" class="pill-text">⚡ Outbound Fan-out</text>
      </g>

      <!-- Pill 2: Inbound Proxies -->
      <g transform="translate(180, 0)">
        <rect width="168" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="4" fill="#818cf8"/>
        <text x="32" y="22.5" class="pill-text">🛡️ Inbound Proxies</text>
      </g>

      <!-- Pill 3: Multi-Channel Alerts -->
      <g transform="translate(360, 0)">
        <rect width="176" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="4" fill="#ec4899"/>
        <text x="32" y="22.5" class="pill-text">🔔 Multi-Channel APIs</text>
      </g>

      <!-- Pill 4: Open-Source -->
      <g transform="translate(548, 0)">
        <rect width="176" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="4" fill="#34d399"/>
        <text x="32" y="22.5" class="pill-text">🌐 Open Source &amp; SaaS</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Border Gradient Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accent-cyan)"/>
</svg>
